<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>扩展管理</title>
    <style>
      /* Windows Phone / Metro live-tile chrome — same tokens as the splash pages
         (loading/updating/error.html). Inlined because this file:// window loads
         outside pi-web, so its CSS variables don't exist here. Square corners
         everywhere; the only round thing in this shell is a status dot. */
      :root {
        --bg: #0a0a0a;
        --bg-panel: #141414;
        --bg-panel-hi: #1c1c1c;
        --text: #ffffff;
        --text-muted: #a6a6a6;
        --text-dim: #6a6a6a;
        --grid: rgba(255, 255, 255, 0.08);
        --accent: #0050ef;
        --green: #60a917;
        --amber: #f0a30a;
        --red: #e51400;
        --steel: #647687;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Selawik, system-ui, -apple-system, BlinkMacSystemFont,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
      }
      body { display: flex; flex-direction: column; }

      header { padding: 22px 26px 14px; border-bottom: 1px solid var(--grid); }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 300; letter-spacing: 0.4px; }
      .sub { font-size: 12.5px; color: var(--text-muted); line-height: 1.65; }
      .sub code { color: var(--accent); font-family: Consolas, ui-monospace, monospace; }

      main { flex: 1; overflow: auto; padding: 14px 26px; }
      .row {
        display: flex;
        gap: 14px;
        padding: 12px 14px;
        margin-bottom: 8px;
        background: var(--bg-panel);
        border-left: 3px solid transparent;
        cursor: pointer;
      }
      .row:hover { background: var(--bg-panel-hi); }
      .row.on { border-left-color: var(--accent); }
      .row.missing { opacity: 0.45; cursor: not-allowed; }

      /* Square Metro checkbox (no native control — it can't be squared reliably). */
      .box {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-top: 2px;
        border: 2px solid var(--text-dim);
        background: transparent;
        position: relative;
      }
      .row.on .box { border-color: var(--accent); background: var(--accent); }
      .row.on .box::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0px;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(42deg);
      }

      .body { flex: 1; min-width: 0; }
      .name { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
      .file {
        margin-left: 8px;
        font-size: 11.5px;
        color: var(--text-dim);
        font-family: Consolas, ui-monospace, monospace;
      }
      .summary { margin-top: 3px; font-size: 12.5px; color: var(--text-muted); }
      .desc { margin-top: 5px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }

      .badges { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .badge {
        font-size: 10.5px;
        letter-spacing: 0.4px;
        padding: 2px 7px;
        color: #fff;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }
      .badge.green { background: var(--green); }
      .badge.amber { background: var(--amber); color: #1a1a1a; }
      .badge.red { background: var(--red); }
      .badge.steel { background: var(--steel); }
      .badge.dim { background: #2a2a2a; color: var(--text-dim); }

      .link {
        background: none;
        border: 1px solid var(--grid);
        color: var(--text-muted);
        font: inherit;
        font-size: 11.5px;
        padding: 2px 9px;
        cursor: pointer;
      }
      .link:hover { border-color: var(--amber); color: var(--amber); }

      footer {
        border-top: 1px solid var(--grid);
        padding: 14px 26px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      footer .spacer { flex: 1; }
      button.btn {
        font: inherit;
        font-size: 13px;
        padding: 8px 20px;
        border: 1px solid var(--grid);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        letter-spacing: 0.3px;
      }
      button.btn:hover { background: var(--bg-panel-hi); }
      button.btn.primary { background: var(--accent); border-color: var(--accent); }
      button.btn.primary:hover { filter: brightness(1.15); }
      .hint { font-size: 11.5px; color: var(--text-dim); }
      .empty { padding: 40px 0; text-align: center; color: var(--text-dim); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">选择要安装的扩展</h1>
      <div class="sub" id="subtitle"></div>
    </header>

    <main id="list"><div class="empty">正在读取内置扩展…</div></main>

    <footer>
      <button class="btn" id="all">全选</button>
      <button class="btn" id="none">全不选</button>
      <button class="btn" id="folder">打开扩展目录</button>
      <span class="spacer"></span>
      <span class="hint" id="hint"></span>
      <button class="btn" id="cancel">稍后再说</button>
      <button class="btn primary" id="ok">确定并应用</button>
    </footer>

    <script>
      let state = { firstRun: true, extensions: [] };
      const selected = new Set();

      const el = (id) => document.getElementById(id);

      function badges(e) {
        const out = [];
        if (e.seedMissing) out.push(['dim', '内置版本缺失']);
        else if (!e.installed && e.disabledFile) out.push(['steel', '已停用']);
        else if (!e.installed) out.push(['dim', '未安装']);
        else out.push(['green', '已安装']);
        if (e.modified) out.push(['amber', '已被你修改']);
        if (e.updateAvailable) out.push(['red', '有新版可用']);
        return out;
      }

      function render() {
        const list = el('list');
        if (!state.extensions.length) {
          list.innerHTML = '<div class="empty">未找到内置扩展包（extensions-seed 缺失）。</div>';
          return;
        }
        list.innerHTML = '';
        for (const e of state.extensions) {
          const row = document.createElement('div');
          row.className = 'row' + (selected.has(e.id) ? ' on' : '') + (e.seedMissing && !e.installed ? ' missing' : '');

          const box = document.createElement('div');
          box.className = 'box';
          row.appendChild(box);

          const body = document.createElement('div');
          body.className = 'body';

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = e.name;
          const file = document.createElement('span');
          file.className = 'file';
          file.textContent = e.file;
          name.appendChild(file);
          body.appendChild(name);

          if (e.summary) {
            const s = document.createElement('div');
            s.className = 'summary';
            s.textContent = e.summary;
            body.appendChild(s);
          }
          if (e.description) {
            const d = document.createElement('div');
            d.className = 'desc';
            d.textContent = e.description;
            body.appendChild(d);
          }

          const bs = document.createElement('div');
          bs.className = 'badges';
          for (const [cls, text] of badges(e)) {
            const b = document.createElement('span');
            b.className = 'badge ' + cls;
            b.textContent = text;
            bs.appendChild(b);
          }
          // The ONLY control that overwrites a file you edited — and it keeps a
          // timestamped copy of your version next to it first.
          if (e.installed && e.updateAvailable) {
            const btn = document.createElement('button');
            btn.className = 'link';
            btn.textContent = e.modified ? '恢复内置版本（先备份你的改动）' : '恢复内置版本';
            btn.addEventListener('click', async (ev) => {
              ev.stopPropagation();
              btn.disabled = true;
              btn.textContent = '恢复中…';
              const r = await window.piExt.restore(e.id);
              if (r && r.ok) {
                await load();
                el('hint').textContent = r.backup ? '已恢复，原文件备份为 ' + r.backup : '已恢复内置版本';
              } else {
                btn.disabled = false;
                btn.textContent = '恢复失败：' + ((r && r.error) || '未知错误');
              }
            });
            bs.appendChild(btn);
          }
          body.appendChild(bs);
          row.appendChild(body);

          row.addEventListener('click', () => {
            if (selected.has(e.id)) selected.delete(e.id);
            else selected.add(e.id);
            render();
          });
          list.appendChild(row);
        }
      }

      async function load() {
        const s = await window.piExt.load();
        state = s || { firstRun: true, extensions: [] };
        selected.clear();
        for (const e of state.extensions) if (e.selected) selected.add(e.id);

        el('title').textContent = state.firstRun ? '选择要安装的扩展' : '扩展管理';
        el('subtitle').innerHTML = state.firstRun
          ? '这些扩展会安装到 <code>' +
            (state.destDir || '~/.pi/agent/extensions') +
            '</code>。取消勾选的不会安装。安装后你可以随意修改它们——<b>之后的启动和应用升级都不会覆盖你改过的文件</b>。'
          : '取消勾选＝停用（重命名为 <code>.ts.disabled</code>，不删除，随时可勾回来）。' +
            '你改过的扩展永远不会被自动覆盖；只有点「恢复内置版本」才会写回内置版，并先备份你的改动。' +
            '改完需重启内嵌服务或在 pi 里 <code>/reload</code> 才生效。';
        el('cancel').textContent = state.firstRun ? '稍后再说' : '取消';
        el('hint').textContent = state.firstRun ? '关闭窗口＝暂不安装，下次启动会再问一次' : '';
        render();
      }

      el('all').addEventListener('click', () => {
        for (const e of state.extensions) if (!e.seedMissing || e.installed) selected.add(e.id);
        render();
      });
      el('none').addEventListener('click', () => {
        selected.clear();
        render();
      });
      el('folder').addEventListener('click', () => window.piExt.openFolder());
      el('cancel').addEventListener('click', () => window.piExt.cancel());
      el('ok').addEventListener('click', async () => {
        el('ok').disabled = true;
        el('ok').textContent = '应用中…';
        await window.piExt.apply(Array.from(selected));
      });

      load();
    </script>
  </body>
</html>
